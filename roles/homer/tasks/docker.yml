---
- name: Make sure the Homer container is created and running
  community.docker.docker_container:
    name: homer
    image: "b4bz/homer:latest"
    pull: true
    state: started
    env:
      UID: "{{ guid }}"
      GID: "{{ guid }}"
      INIT_ASSETS: "1"
      TZ: "{{ timezone }}"
    volumes:
      - "{{ docker_dir }}/{{ container_name }}:/www/assets"
    ports:
      - "127.0.0.1:{{ homer_port }}:8080"
    restart_policy: unless-stopped

- name: Add {{ container_name }} to the NGINX network (reverse-proxy)
  docker_network:
    name: ngx_internal_network
    connected:
      - "{{ container_name }}"
    appends: yes
  when: enable_nginx