---
#
# Install / update lazydocker
# From: https://lindevs.com/install-lazydocker-on-ubuntu/
#

- name: Check installed lazydocker version
  ansible.builtin.command:
    cmd: lazydocker --version
  register: lazydocker_installed
  changed_when: false
  failed_when: false

- name: Get latest lazydocker version from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/jesseduffield/lazydocker/releases/latest
    return_content: true
  register: lazydocker_release
  changed_when: false

- name: Set version facts
  ansible.builtin.set_fact:
    lazydocker_latest: "{{ lazydocker_release.json.tag_name | regex_replace('^v', '') }}"
    lazydocker_current: >-
      {{ (lazydocker_installed.stdout | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+')) | default('') }}

- name: Map architecture to lazydocker naming
  ansible.builtin.set_fact:
    lazydocker_arch: >-
      {{ {'x86_64': 'x86_64', 'aarch64': 'arm64', 'armv7l': 'armv7', 'armv6l': 'armv6'}
         [ansible_facts['architecture']] | default('x86_64') }}

- name: Report lazydocker version status
  ansible.builtin.debug:
    msg: >-
      lazydocker current={{ lazydocker_current | default('none') }}
      latest={{ lazydocker_latest }}
      action={{ 'update' if lazydocker_current != lazydocker_latest else 'none' }}

- name: Download lazydocker
  ansible.builtin.get_url:
    url: >-
      https://github.com/jesseduffield/lazydocker/releases/download/v{{ lazydocker_latest }}/lazydocker_{{ lazydocker_latest }}_Linux_{{ lazydocker_arch }}.tar.gz
    dest: "{{ home_dir }}/lazydocker.tar.gz"
    mode: '0644'
  when: lazydocker_current != lazydocker_latest

- name: Create temp extraction directory
  ansible.builtin.file:
    path: "{{ home_dir }}/lazydocker-temp"
    state: directory
    mode: '0755'
  when: lazydocker_current != lazydocker_latest

- name: Extract lazydocker archive
  ansible.builtin.unarchive:
    src: "{{ home_dir }}/lazydocker.tar.gz"
    dest: "{{ home_dir }}/lazydocker-temp"
    remote_src: true
  when: lazydocker_current != lazydocker_latest

- name: Install lazydocker binary
  ansible.builtin.copy:
    src: "{{ home_dir }}/lazydocker-temp/lazydocker"
    dest: /usr/local/bin/lazydocker
    mode: '0755'
    remote_src: true
  become: true
  when: lazydocker_current != lazydocker_latest

- name: Verify lazydocker installation
  ansible.builtin.command:
    cmd: lazydocker --version
  register: lazydocker_version
  changed_when: false
  failed_when: false

- name: Show installed version
  ansible.builtin.debug:
    msg: "{{ lazydocker_version.stdout }}"

- name: Clean up temp files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "{{ home_dir }}/lazydocker.tar.gz"
    - "{{ home_dir }}/lazydocker-temp"