---
- name: Include OS-specific variables
  ansible.builtin.include_vars: "dependencies.yml"

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_facts['architecture'] | replace('aarch64','arm64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present

- name: Remove conflicting Ubuntu docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: absent
    purge: false
  when: "'docker.io' in ansible_facts.packages"

- name: Install dependencies for docker
  ansible.builtin.apt:
    name: "{{ docker_deps }}"
    state: present
    update_cache: true

- name: Install docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  when: not ansible_check_mode

- name: Ensure group docker exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups:
      - docker
    append: true

- name: Make sure that the docker folders exists
  ansible.builtin.file:
    path: "{{ docker_dir }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
    state: directory

- name: Ensure Docker is active
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true