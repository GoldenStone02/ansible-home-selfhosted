---
- name: "Update host and containers"
  hosts: raspberry_pi
  become: true

  tasks:
    - name: Update apt cache and upgrade packages
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        autoremove: true

    - name: Check for reboot requirement
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Notify if reboot needed
      ansible.builtin.debug:
        msg: "Reboot required to finish updates"
      when: reboot_required.stat.exists

    - name: Pull latest images and recreate changed containers
      community.docker.docker_container:
        name: "{{ item }}"
        image: "{{ item }}"
        pull: true
        state: started
        recreate: true
      loop:
        - homer
        - pihole-unbound
        - nginxproxymanager
      ignore_errors: true